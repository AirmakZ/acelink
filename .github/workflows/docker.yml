name: Build and push ghcr.io/airmakz/acelinkui

# The image is tagged with the AceStream version it contains (ARG ACESTREAM_VERSION in the
# Dockerfile), not the app's version, so it only changes when the engine does.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Read the AceStream version
        id: engine
        run: echo "version=$(sed -n 's/^ARG ACESTREAM_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64  # linux/arm64 won't work because there's no acestream bin for this platform
          push: true
          tags: |
            ghcr.io/airmakz/acelinkui:latest
            ghcr.io/airmakz/acelinkui:${{ steps.engine.outputs.version }}
